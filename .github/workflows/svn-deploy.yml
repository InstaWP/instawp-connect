name: Deploy  to WordPress.org
on:
  push:
    tags:
    # Release tags only. This was "*", which matched ANY tag name — so a tag
    # created for something other than a release (e.g. pinning a commit for
    # reference) published that commit to WordPress.org. That happened on
    # 2026-09-07: a tag named "incident-14ypaj0acdw" deployed its commit to
    # SVN trunk. Every release this plugin has ever cut is a bare version
    # number (0.0.2, 0.1.3.8, ...), so requiring a digit-led "N.N" prefix
    # covers all of them and excludes names like that one.
    # To pin a commit without publishing it, use a ref outside refs/tags —
    # e.g. refs/incident/<name> — which no workflow watches.
    - "[0-9]+.[0-9]+*"
    
jobs:
  tag:
    name: New tag
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - name: Build # Remove or modify this step as needed
      run: |
        echo "building"
    - name: Install Subversion
      run: sudo apt-get install subversion
    - name: WordPress Plugin Deploy
      uses: 10up/action-wordpress-plugin-deploy@stable
      env:
        SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
